services:
  - type: web
    name: academa-model-api
    runtime: docker
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MODEL_API_KEY
        generateValue: true
      - key: OMP_NUM_THREADS
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "2"
